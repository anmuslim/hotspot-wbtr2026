<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internet Hotspot - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Ganti file logo & iklan di folder img/ :
         img/logo-company.png  -> logo perusahaan Anda
         img/logo-client.png   -> logo perusahaan client
         img/ad-1.jpg, img/ad-2.jpg, img/ad-3.jpg (dst) -> gambar iklan carousel
         Tambah/kurangi slide iklan cukup dengan menambah/menghapus blok
         <div class="carousel-slide">...</div> di bawah, dot & auto-slide
         menyesuaikan otomatis.

         UBAH RASIO IKLAN:
         Tinggal ganti class di <div class="carousel ..." id="adCarousel">
         pilih salah satu: ratio-16x9 (default) | ratio-4x3 | ratio-1x1 |
         ratio-3x2 | ratio-9x16 | ratio-2x1
         Preset-nya ada di css/style.css. Mau rasio lain? tambahkan sendiri
         di style.css, contoh:
           .carousel.ratio-21x9{ --ad-ratio: 21/9; --ad-max-h: 300px; }
         lalu pakai class "ratio-21x9" di sini. -->

    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap animated fadeIn">

                <!-- <div class="signal"><span class="dot"></span></div> -->

                <div class="logo-row">
                    <img src="img/whusnet.png" alt="Logo Perusahaan" />
                    <span class="logo-divider"></span>
                    <img src="img/logowbtr.png" alt="Logo Client" />
                </div>

                <h1>Selamat Datang , Runners!!</h1>
                <p class="subtitle"></p>

                <!-- ===== Ad Carousel ===== -->
                <div class="carousel ratio-3x4" id="adCarousel">
                    <div class="carousel-track" id="carouselTrack">
                        <div class="carousel-slide"><a href="#" target="_blank" rel="noopener"><img src="img/bannerwbtr1.png" alt="pict 1" draggable="false" /></a></div>
                        <div class="carousel-slide"><a href="#" target="_blank" rel="noopener"><img src="img/bannerwbtr2.png" alt="pict 2" draggable="false" /></a></div>
                        <div class="carousel-slide"><a href="#" target="_blank" rel="noopener"><img src="img/bannerwbtr3.png" alt="pict 3" draggable="false" /></a></div>
                        <div class="carousel-slide"><a href="#" target="_blank" rel="noopener"><img src="img/bannerwbtr4.png" alt="pict 4" draggable="false" /></a></div>
                    </div>
                    <button type="button" class="carousel-nav prev" aria-label="Sebelumnya">&#8249;</button>
                    <button type="button" class="carousel-nav next" aria-label="Berikutnya">&#8250;</button>
                    <div class="carousel-dots" id="carouselDots"></div>
                </div>

                <!-- Form Trial: semua kolom wajib diisi, tombol aktif setelah lengkap.
                     Tombol ini = login trial bawaan MikroTik (username T-<MAC>) -->
                <form name="trial" id="trialForm" action="$(link-login-only)" method="post" autocomplete="off">
                    <input type="hidden" name="username" value="T-$(mac)" />
                    <input type="hidden" name="dst" value="$(link-orig)" />
                    <input type="hidden" name="popup" value="true" />

                    <p class="info $(if error)alert$(endif)">
                        $(if error == "")Isi Data Diri Anda untuk Terhubung ke Internet dan Dapatkan Promo Gratis Internet 1 Bulan$(endif)
                        $(if error)$(error)$(endif)
                    </p>

                    <label><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg>
                        <input name="nama" type="text" placeholder="Nama" autocomplete="name" required />
                    </label>
                    <label><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
                        <input name="alamat" type="text" placeholder="Domisili" autocomplete="street-address" required />
                    </label>
                    <label><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg>
                        <input name="hp" type="tel" inputmode="tel" placeholder="Nomor HP" pattern="[0-9+]{9,15}" title="Nomor HP 9-15 digit" autocomplete="tel" required />
                    </label>

                    <input type="submit" id="trialBtn" value="CONNECT" disabled />
                </form>

                <p class="info bt">*syarat dan ketentuan berlaku</p>

            </div>
        </div>
    </div>

    <script>
        (function () {
            var f = document.getElementById('trialForm');
            var b = document.getElementById('trialBtn');
            var fields = f.querySelectorAll('input[name=nama],input[name=alamat],input[name=hp]');
            function check() {
                var ok = f.checkValidity();
                for (var i = 0; i < fields.length; i++) if (!fields[i].value.trim()) ok = false;
                b.disabled = !ok;
            }
            for (var i = 0; i < fields.length; i++) fields[i].addEventListener('input', check);
            var SHEET_URL = 'https://script.google.com/macros/s/AKfycbz1t2bMY0Y8Oi-Q8pFfxsGqvGCTk5_-5bbuHcm8Tq8S7_d_O4vkbTQqN50Clp4K0iY3/exec';   // URL Web App (https://script.google.com/macros/s/.../exec)
            var SHEET_TOKEN = 'whusnetwbtr#2026';             // samakan dengan TOKEN di Apps Script
            var sending = false;
            f.addEventListener('submit', function (e) {
                check();
                if (b.disabled || sending) { e.preventDefault(); return; }
                // belum dikonfigurasi / browser lama: langsung login trial saja
                if (SHEET_URL.indexOf('https://') !== 0 || !window.fetch || !window.URLSearchParams) return;
                e.preventDefault();
                sending = true;
                b.disabled = true; b.value = 'Memproses...';
                var data = new URLSearchParams({
                    token: SHEET_TOKEN,
                    nama: f.nama.value.trim(), alamat: f.alamat.value.trim(), hp: f.hp.value.trim(),
                    mac: '$(mac)', ip: '$(ip)'
                });
                var t = setTimeout(go, 3000);   // jangan tahan login lebih dari 3 detik
                function go() { clearTimeout(t); f.submit(); }
                fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', body: data }).then(go, go);
            });
            check();
        })();
    </script>

    <script>
        (function () {
            var track = document.getElementById('carouselTrack');
            var dotsWrap = document.getElementById('carouselDots');
            var carousel = document.getElementById('adCarousel');
            var slides = track.children.length;
            var index = 0;
            var AUTO_MS = 4500;
            var RESUME_MS = 6000;
            var timer = null;
            var resumeTimer = null;

            // build dots
            for (var i = 0; i < slides; i++) {
                var b = document.createElement('button');
                if (i === 0) b.className = 'active';
                b.setAttribute('aria-label', 'Slide ' + (i + 1));
                (function (idx) {
                    b.addEventListener('click', function () { goTo(idx); restartAuto(true); });
                })(i);
                dotsWrap.appendChild(b);
            }
            var dots = dotsWrap.children;

            function render() {
                track.style.transform = 'translateX(-' + (index * 100) + '%)';
                for (var i = 0; i < dots.length; i++) {
                    dots[i].className = (i === index) ? 'active' : '';
                }
            }

            function goTo(i) {
                index = (i + slides) % slides;
                render();
            }

            function next() { goTo(index + 1); }
            function prev() { goTo(index - 1); }

            function startAuto() {
                stopAuto();
                timer = setInterval(next, AUTO_MS);
            }
            function stopAuto() {
                if (timer) clearInterval(timer);
                timer = null;
            }
            function restartAuto(delay) {
                stopAuto();
                if (resumeTimer) clearTimeout(resumeTimer);
                if (delay) {
                    resumeTimer = setTimeout(startAuto, RESUME_MS);
                } else {
                    startAuto();
                }
            }

            document.querySelector('.carousel-nav.prev').addEventListener('click', function () { prev(); restartAuto(true); });
            document.querySelector('.carousel-nav.next').addEventListener('click', function () { next(); restartAuto(true); });

            // touch / pointer swipe
            var startX = 0, deltaX = 0, dragging = false;

            carousel.addEventListener('touchstart', function (e) {
                startX = e.touches[0].clientX;
                dragging = true;
                stopAuto();
            }, { passive: true });

            carousel.addEventListener('touchmove', function (e) {
                if (!dragging) return;
                deltaX = e.touches[0].clientX - startX;
            }, { passive: true });

            carousel.addEventListener('touchend', function () {
                if (!dragging) return;
                dragging = false;
                if (deltaX > 40) prev();
                else if (deltaX < -40) next();
                deltaX = 0;
                restartAuto(true);
            });

            // mouse drag (desktop)
            carousel.addEventListener('mousedown', function (e) {
                startX = e.clientX;
                dragging = true;
                stopAuto();
            });
            window.addEventListener('mousemove', function (e) {
                if (!dragging) return;
                deltaX = e.clientX - startX;
            });
            window.addEventListener('mouseup', function () {
                if (!dragging) return;
                dragging = false;
                if (deltaX > 40) prev();
                else if (deltaX < -40) next();
                deltaX = 0;
                restartAuto(true);
            });

            render();
            startAuto();
        })();
    </script>

</body>

</html>
